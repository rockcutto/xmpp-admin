# Merge only the relevant blocks into your existing ejabberd.yml.
# Do not replace a working configuration with this example.
#
# Reuse an existing ejabberd_http /api: mod_http_api listener when one
# already exists. Add this loopback listener only when you need one:
#
# listen:
#   -
#     port: 5281
#     module: ejabberd_http
#     ip: 127.0.0.1
#     request_handlers:
#       /api: mod_http_api

acl:
  xmpp_admin_api:
    user:
      - "xmpp-admin@example.org"

# Commands with a host argument also pass ejabberd's configure access rule.
# Merge these entries with the existing configure rule. Keep them as separate
# allow entries: ACLs listed under one allow section are matched together.
access_rules:
  configure:
    - allow: admin
    - allow: xmpp_admin_api

api_permissions:
  "XMPP Admin API":
    from:
      - mod_http_api
    who:
      acl: xmpp_admin_api
    what:
      - list_invites
      - generate_invite
      - generate_invite_with_username
      - expire_invite_by_token
      - registered_users
      - connected_users
      - status
      - muc_online_rooms

# Keep the existing mod_invites/mod_register policy unchanged.
# muc_online_rooms is read-only and used by the Rooms page. It requires the
# corresponding MUC administration command to be available; the rest of the
# panel continues to work if that command is unavailable.
# XMPP Admin reads it from ejabberd.yml.
#
# Never replace the command allowlist with "*".
# Prefer a loopback API listener, or HTTPS with a certificate-valid hostname
# on a trusted/private path. XMPP Admin rejects plaintext remote API URLs.
